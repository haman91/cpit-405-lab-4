<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Parts Request Form</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: #f2f2f2;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 30px;
        }


        .form-container {
            background: white;
            max-width: 850px;
            margin: auto;
            padding: 35px 45px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }


        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 35px;
            font-size: 32px;
        }


        label {
            display: block;
            font-family: "Times New Roman", serif;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }


        input,
        textarea {

            width: 100%;
            padding: 15px 18px;

            border: 2px solid #d0d0d0;
            border-radius: 8px;

            font-size: 18px;
            margin-bottom: 18px;

            transition: 0.3s;

        }


        input:focus,
        textarea:focus {

            border-color: #333;
            outline: none;
            background: white;

        }


        input::placeholder,
        textarea::placeholder {

            color: #888;

        }


        textarea {

            height: 120px;
            resize: vertical;

        }


        .submit-btn {

            width: 100%;
            background: #222;
            color: white;

            padding: 16px;

            border: none;
            border-radius: 8px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;

            transition: 0.3s;

        }


        .submit-btn:hover {

            background: #555;

        }


        .reset-btn {

            width: 100%;
            background: #ddd;
            color: #222;

            padding: 14px;

            border: none;
            border-radius: 8px;

            font-size: 18px;

            cursor: pointer;

            margin-top: 12px;

        }


        .reset-btn:hover {

            background: #bbb;

        }


    </style>

</head>


<body>


<div class="form-container">


    <h1>Auto Parts Request Form</h1>


    <form>


        <label>First Name:</label>
        <input type="text" placeholder="Enter your first name">


        <label>Last Name:</label>
        <input type="text" placeholder="Enter your last name">


        <label>Email:</label>
        <input type="email" placeholder="Enter your email address">


        <label>Phone number:</label>
        <input type="text" placeholder="Enter your phone number">


        <label>Make:</label>
        <input type="text" placeholder="Make">


        <label>Model:</label>
        <input type="text" placeholder="Model">


        <label>Year:</label>
        <input type="number" placeholder="Year">


        <label>Date:</label>
        <input type="date">


        <label>Spare Part:</label>
        <input type="text" placeholder="Enter the spare part you need">


        <label>Quantity:</label>
        <input type="number" placeholder="Enter the quantity of the spare part you need">


        <label>Comment:</label>
        <textarea placeholder="Enter your comment"></textarea>


        <button class="submit-btn" type="submit">
            Submit Request
        </button>


        <button class="reset-btn" type="reset">
            Clear Form
        </button>


    </form>


</div>


</body>

</html>
